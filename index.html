<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>نظام إدارة الذهب والمجوهرات</title>
    
    <!-- Google Fonts - Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/print.css" />
    <link rel="stylesheet" href="css/pos.css" />
    <link rel="stylesheet" href="css/suppliers.css" />
    <link rel="stylesheet" href="css/accounting.css" />
    <link rel="stylesheet" href="css/inventory.css" />
    <link rel="stylesheet" href="css/analytics.css" />
    <link rel="stylesheet" href="css/returns.css" />
    <link rel="stylesheet" href="css/i18n.css" />
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar" role="navigation">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-icon">✦</span>
                    <span class="logo-text"><span class="gold">ذهب</span> Dahab</span>
                </div>
                <button id="themeToggle" class="theme-toggle">🌙</button>
            </div>

            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-link active" data-page="dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">لوحة التحكم</span>
                </a>
                <a href="#data-entry" class="nav-link" data-page="data-entry">
                    <span class="nav-icon">✏️</span>
                    <span class="nav-label">إدخال البيانات</span>
                </a>
                <a href="#qr-print" class="nav-link" data-page="qr-print">
                    <span class="nav-icon">🏷️</span>
                    <span class="nav-label">طباعة QR</span>
                </a>
                <a href="#pos-scanner" class="nav-link" data-page="pos-scanner">
                    <span class="nav-icon">📱</span>
                    <span class="nav-label">الماسح الضوئي</span>
                </a>
                <a href="#inventory" class="nav-link" data-page="inventory">
                    <span class="nav-icon">📦</span>
                    <span class="nav-label">المخزون</span>
                </a>
                <a href="#suppliers" class="nav-link" data-page="suppliers">
                    <span class="nav-icon">🤝</span>
                    <span class="nav-label">الموردين والعملاء</span>
                </a>
                <a href="#accounting" class="nav-link" data-page="accounting">
                    <span class="nav-icon">💰</span>
                    <span class="nav-label">المحاسبة</span>
                </a>
                <a href="#analytics" class="nav-link" data-page="analytics">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label">التحليلات</span>
                </a>
                <a href="#returns" class="nav-link" data-page="returns">
                    <span class="nav-icon">↩️</span>
                    <span class="nav-label">المرتجعات</span>
                </a>
                <a href="#employees" class="nav-link" data-page="employees">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">الموظفين</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-avatar">👤</span>
                    <span class="user-name" id="userName">المستخدم</span>
                </div>
                <button id="logoutBtn" class="logout-btn">
                    <span class="logout-icon">🚪</span>
                    <span class="logout-label">تسجيل الخروج</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="sidebarToggle" class="sidebar-toggle">☰</button>
                    <div class="branch-selector-wrapper">
                        <label for="branchSelector" class="branch-label">
                            <span class="branch-icon">🏢</span>
                            <span class="branch-label-text">الفرع</span>
                        </label>
                        <select id="branchSelector" class="branch-selector">
                            <option value="">جاري التحميل...</option>
                        </select>
                    </div>
                </div>

                <div class="top-bar-center">
                    <div class="gold-ticker" id="goldTicker">
                        <div class="ticker-item">
                            <span class="ticker-label">24K</span>
                            <span class="ticker-value" id="goldRate24K">--</span>
                        </div>
                        <div class="ticker-divider"></div>
                        <div class="ticker-item">
                            <span class="ticker-label">21K</span>
                            <span class="ticker-value" id="goldRate21K">--</span>
                        </div>
                        <div class="ticker-divider"></div>
                        <div class="ticker-item">
                            <span class="ticker-label">18K</span>
                            <span class="ticker-value" id="goldRate18K">--</span>
                        </div>
                        <div class="ticker-divider"></div>
                        <div class="ticker-item ticker-update">
                            <span class="ticker-label">آخر تحديث</span>
                            <span class="ticker-value ticker-time" id="tickerUpdateTime">--</span>
                        </div>
                    </div>
                </div>

                <div class="top-bar-right">
                    <div class="lang-switcher">
                        <button class="lang-btn active" data-lang="ar">🇸🇦 عربي</button>
                        <button class="lang-btn" data-lang="en">🇬🇧 EN</button>
                    </div>
                    <button id="themeToggleTop" class="theme-toggle-top">🌙</button>
                </div>
            </header>

            <!-- Page Content -->
            <div id="pageContent" class="page-content">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p class="loading-text">جاري التحميل...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Hidden Print Container -->
    <div id="printContainer" style="display: none;"></div>

    <!-- Hidden Audio -->
    <div id="audioContainer" style="display: none;"></div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
