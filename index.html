<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="app.name">نظام إدارة الذهب والمجوهرات | Gold Management System</title>
    
    <!-- External Libraries via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>
    <script src="https://unpkg.com/lucide@latest">
    </script>
    
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/print.css" />
    <link rel="stylesheet" href="css/pos.css" />
    <link rel="stylesheet" href="css/suppliers.css" />
    <link rel="stylesheet" href="css/accounting.css" />
    <link rel="stylesheet" href="css/inventory.css" />
    <link rel="stylesheet" href="css/analytics.css" />
    <link rel="stylesheet" href="css/returns.css" />
    <link rel="stylesheet" href="css/i18n.css" />
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main Navigation">
            <div class="sidebar-header">
                <div class="logo-container">
                    <span class="logo-icon">💎</span>
                    <span class="logo-text" data-i18n="app.name">الذهب</span>
                </div>
                <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
            </div>

            <nav class="sidebar-nav">
                <a href="#dashboard" class="nav-link active" data-page="dashboard" data-tooltip="nav.dashboard">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label" data-i18n="nav.dashboard">لوحة التحكم</span>
                </a>
                <a href="#data-entry" class="nav-link" data-page="data-entry" data-tooltip="nav.data-entry">
                    <span class="nav-icon">✏️</span>
                    <span class="nav-label" data-i18n="nav.data-entry">إدخال البيانات</span>
                </a>
                <a href="#qr-print" class="nav-link" data-page="qr-print" data-tooltip="nav.qr-print">
                    <span class="nav-icon">🏷️</span>
                    <span class="nav-label" data-i18n="nav.qr-print">طباعة QR</span>
                </a>
                <a href="#pos-scanner" class="nav-link" data-page="pos-scanner" data-tooltip="nav.pos-scanner">
                    <span class="nav-icon">📱</span>
                    <span class="nav-label" data-i18n="nav.pos-scanner">الماسح الضوئي</span>
                </a>
                <a href="#inventory" class="nav-link" data-page="inventory" data-tooltip="nav.inventory">
                    <span class="nav-icon">📦</span>
                    <span class="nav-label" data-i18n="nav.inventory">المخزون</span>
                </a>
                <a href="#suppliers" class="nav-link" data-page="suppliers" data-tooltip="nav.suppliers">
                    <span class="nav-icon">🤝</span>
                    <span class="nav-label" data-i18n="nav.suppliers">الموردين والعملاء</span>
                </a>
                <a href="#accounting" class="nav-link" data-page="accounting" data-tooltip="nav.accounting">
                    <span class="nav-icon">💰</span>
                    <span class="nav-label" data-i18n="nav.accounting">المحاسبة</span>
                </a>
                <a href="#analytics" class="nav-link" data-page="analytics" data-tooltip="nav.analytics">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label" data-i18n="nav.analytics">التحليلات</span>
                </a>
                <a href="#returns" class="nav-link" data-page="returns" data-tooltip="nav.returns">
                    <span class="nav-icon">↩️</span>
                    <span class="nav-label" data-i18n="nav.returns">المرتجعات</span>
                </a>
                <a href="#employees" class="nav-link" data-page="employees" data-tooltip="nav.employees">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label" data-i18n="nav.employees">الموظفين</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-info">
                    <span class="user-avatar">👤</span>
                    <span class="user-name" id="userName">المستخدم</span>
                </div>
                <button id="logoutBtn" class="logout-btn">
                    <span class="logout-icon">🚪</span>
                    <span class="logout-label" data-i18n="nav.logout">تسجيل الخروج</span>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div class="top-bar-left">
                    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">
                        <span>☰</span>
                    </button>
                    <div class="branch-selector-wrapper">
                        <label for="branchSelector" class="branch-label">
                            <span class="branch-icon">🏢</span>
                            <span class="branch-label-text" data-i18n="nav.branch">الفرع</span>
                        </label>
                        <select id="branchSelector" class="branch-selector" aria-label="Select branch">
                            <option value="" data-i18n="common.loading">جاري التحميل...</option>
                        </select>
                    </div>
                </div>

                <div class="top-bar-center">
                    <div class="gold-ticker" id="goldTicker">
                        <div class="ticker-item">
                            <span class="ticker-label">24K</span>
                            <span class="ticker-value" id="goldRate24K">--</span>
                        </div>
                        <div class="ticker-divider"></div>
                        <div class="ticker-item">
                            <span class="ticker-label">21K</span>
                            <span class="ticker-value" id="goldRate21K">--</span>
                        </div>
                        <div class="ticker-divider"></div>
                        <div class="ticker-item">
                            <span class="ticker-label">18K</span>
                            <span class="ticker-value" id="goldRate18K">--</span>
                        </div>
                        <div class="ticker-divider"></div>
                        <div class="ticker-item ticker-update">
                            <span class="ticker-label" data-i18n="dashboard.last-update">آخر تحديث</span>
                            <span class="ticker-value ticker-time" id="tickerUpdateTime">--</span>
                        </div>
                    </div>
                </div>

                <div class="top-bar-right">
                    <div class="lang-switcher">
                        <button class="lang-btn active" data-lang="ar" aria-label="lang.arabic">🇸🇦 عربي</button>
                        <button class="lang-btn" data-lang="en" aria-label="lang.english">🇬🇧 EN</button>
                    </div>
                    <button id="themeToggleTop" class="theme-toggle-top" aria-label="theme.toggle">
                        <span class="theme-icon-top">🌙</span>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div id="pageContent" class="page-content">
                <!-- Dynamic content will be rendered here -->
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p class="loading-text" data-i18n="common.loading">جاري التحميل...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Hidden Print Container -->
    <div id="printContainer" style="display: none;"></div>

    <!-- Hidden Audio Context for Beep -->
    <div id="audioContainer" style="display: none;"></div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
